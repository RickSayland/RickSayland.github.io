<svg viewBox="0 0 570 214" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="avCloud" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#9fd0ff" stop-opacity="0.30"/>
      <stop offset="55%" stop-color="#5f8fd4" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#5f8fd4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="avPos" cx="42%" cy="38%">
      <stop offset="0%" stop-color="#ffd2a8"/>
      <stop offset="55%" stop-color="#ff8f38"/>
      <stop offset="100%" stop-color="#9a4310"/>
    </radialGradient>
    <radialGradient id="avNeg" cx="42%" cy="38%">
      <stop offset="0%" stop-color="#c6e6ff"/>
      <stop offset="55%" stop-color="#3d9eff"/>
      <stop offset="100%" stop-color="#16457e"/>
    </radialGradient>
    <radialGradient id="avNuc" cx="40%" cy="35%">
      <stop offset="0%" stop-color="#ffe2dc"/>
      <stop offset="60%" stop-color="#ff5c50"/>
      <stop offset="100%" stop-color="#8a1f18"/>
    </radialGradient>
  </defs>

  <rect width="570" height="214" rx="15" fill="#04060b"/>
  <circle cx="108" cy="107" r="98" fill="url(#avCloud)"/>

  <!-- the box the atom sits in -->
  <g fill="none" stroke="#8fa4bd" stroke-width="1.1" opacity="0.4">
    <path d="M44 58 L140 42 L178 70 L82 88 Z"/>
    <path d="M44 58 L44 150 L82 180 L178 162 L178 70"/>
    <path d="M82 88 L82 180"/>
  </g>
  <path d="M44 150 L140 134 L178 162 M140 42 L140 134" fill="none" stroke="#8fa4bd" stroke-width="1" stroke-dasharray="3 4" opacity="0.25"/>

  <!-- a d(z²) orbital: two positive lobes pinched to the nucleus, threaded
       through the negative ring (back half first, front half last) -->
  <ellipse cx="111" cy="112" rx="58" ry="17" fill="url(#avNeg)" opacity="0.8"/>
  <path d="M111 112 C 90 100, 86 44, 111 40 C 136 44, 132 100, 111 112 Z" fill="url(#avPos)"/>
  <path d="M111 112 C 90 124, 86 180, 111 184 C 136 180, 132 124, 111 112 Z" fill="url(#avPos)"/>
  <path d="M53 112 A58 17 0 0 0 169 112 L150 112 A39 6 0 0 1 72 112 Z" fill="url(#avNeg)"/>
  <path d="M62 117 A49 12 0 0 0 160 117" fill="none" stroke="#c6e6ff" stroke-width="1.2" opacity="0.4"/>

  <!-- the nucleus, drawn far too large -->
  <circle cx="111" cy="112" r="5" fill="url(#avNuc)"/>

  <text x="212" y="98" font-family="system-ui,-apple-system,sans-serif" font-size="42" font-weight="700" fill="#cdd9e8" letter-spacing="1">Atom Viewer</text>
  <text x="213" y="128" font-family="ui-monospace,monospace" font-size="13" fill="#5d6e85" letter-spacing="2.2">ORBITALS · NUCLEUS · ISOTOPES</text>
</svg>
