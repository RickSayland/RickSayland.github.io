<svg viewBox="0 0 570 214" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="dynGlow" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#ff8a3d" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ff8a3d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dynCore" cx="40%" cy="34%">
      <stop offset="0%" stop-color="#ffe3ae"/>
      <stop offset="55%" stop-color="#f0a655"/>
      <stop offset="100%" stop-color="#8c3b1e"/>
    </radialGradient>
  </defs>

  <rect width="570" height="214" rx="15" fill="#070a12"/>
  <circle cx="108" cy="107" r="92" fill="url(#dynGlow)"/>

  <!-- rotation axis -->
  <path d="M108 12 L108 202" stroke="#8fa4bd" stroke-width="1.6" stroke-dasharray="3 5" opacity="0.45"/>

  <!-- poloidal field lines, outermost to innermost -->
  <path d="M108 20 C58 34 40 74 40 107 C40 140 58 180 108 194 C158 180 176 140 176 107 C176 74 158 34 108 20 Z"
        fill="none" stroke="#f0b45c" stroke-width="2" opacity="0.55"/>
  <path d="M108 34 C70 46 56 78 56 107 C56 136 70 168 108 180 C146 168 160 136 160 107 C160 78 146 46 108 34 Z"
        fill="none" stroke="#f0b45c" stroke-width="2" opacity="0.75"/>
  <path d="M108 50 C82 60 72 84 72 107 C72 130 82 154 108 164 C134 154 144 130 144 107 C144 84 134 60 108 50 Z"
        fill="none" stroke="#6fc3ff" stroke-width="2" opacity="0.8"/>

  <!-- outer core: the toroidal field, east on one side, west on the other -->
  <circle cx="108" cy="107" r="62" fill="#141024"/>
  <path d="M108 45 A62 62 0 0 1 108 169 Z" fill="#c25a1e" opacity="0.55"/>
  <path d="M108 45 A62 62 0 0 0 108 169 Z" fill="#1f6fae" opacity="0.55"/>
  <circle cx="108" cy="107" r="62" fill="none" stroke="#ffaa78" stroke-width="1.4" opacity="0.6"/>

  <!-- tangent cylinder -->
  <path d="M86 49 L86 165 M130 49 L130 165" stroke="#bed2ff" stroke-width="1.2" stroke-dasharray="3 4" opacity="0.3"/>

  <!-- inner core -->
  <circle cx="108" cy="107" r="22" fill="url(#dynCore)"/>

  <text x="212" y="98" font-family="system-ui,-apple-system,sans-serif" font-size="42" font-weight="700" fill="#cdd9e8" letter-spacing="1">Geodynamo</text>
  <text x="213" y="128" font-family="ui-monospace,monospace" font-size="13" fill="#5d6e85" letter-spacing="2.2">EARTH'S MAGNETIC FIELD</text>
</svg>
