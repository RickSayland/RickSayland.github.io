<svg viewBox="0 0 570 214" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="wfGlow" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#5fd4ff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#5fd4ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wfAhead" x1="0" x2="1">
      <stop offset="0%" stop-color="#5fd4ff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#8fb8ff" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="wfBehind" x1="1" x2="0">
      <stop offset="0%" stop-color="#ffb547" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ffb547" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <rect width="570" height="214" rx="15" fill="#04060b"/>
  <circle cx="112" cy="107" r="96" fill="url(#wfGlow)"/>

  <!-- stars, squeezed toward the bow -->
  <g fill="#cfe2ff">
    <circle cx="196" cy="60" r="1.4"/><circle cx="204" cy="92" r="1.1"/><circle cx="199" cy="128" r="1.3"/>
    <circle cx="190" cy="150" r="0.9"/><circle cx="186" cy="40" r="0.9"/><circle cx="208" cy="112" r="1.6"/>
    <circle cx="30" cy="54" r="0.8" opacity="0.4"/><circle cx="24" cy="150" r="0.8" opacity="0.35"/>
  </g>

  <!-- the Alcubierre surface in profile: a trench of contraction ahead, a
       ridge of expansion behind, the flat cabin between -->
  <g fill="none" stroke-linecap="round">
    <path d="M18 128 C 44 128, 52 128, 60 120 C 66 112, 70 72, 76 72 C 82 72, 84 116, 92 124 L 132 124 C 140 116, 142 150, 148 156 C 154 162, 158 134, 164 128 C 172 128, 190 128, 206 128"
          stroke="#8193ab" stroke-width="1.2" opacity="0.5"/>
    <path d="M18 116 C 44 116, 54 116, 62 108 C 68 100, 72 58, 78 58 C 84 58, 86 104, 94 112 L 130 112 C 138 104, 142 140, 148 146 C 154 152, 158 122, 166 116 C 174 116, 190 116, 206 116"
          stroke="#b7c5d8" stroke-width="1.5" opacity="0.8"/>
    <path d="M62 108 C 68 100, 72 58, 78 58 C 84 58, 86 104, 94 112" stroke="url(#wfBehind)" stroke-width="3"/>
    <path d="M130 112 C 138 104, 142 140, 148 146 C 154 152, 158 122, 166 116" stroke="url(#wfAhead)" stroke-width="3"/>
  </g>

  <!-- bubble wall and ship -->
  <ellipse cx="112" cy="112" rx="52" ry="16" fill="none" stroke="#5fd4ff" stroke-width="1.4" stroke-dasharray="3 4" opacity="0.7"/>
  <path d="M100 108 L122 108 L128 112 L122 116 L100 116 Z" fill="#dfe8f5"/>
  <path d="M130 112 L150 112" stroke="#5fd4ff" stroke-width="1.2" opacity="0.8"/>
  <path d="M150 112 L145 109 L145 115 Z" fill="#5fd4ff" opacity="0.8"/>

  <text x="236" y="98" font-family="system-ui,-apple-system,sans-serif" font-size="42" font-weight="700" fill="#cdd9e8" letter-spacing="1">Warp Field</text>
  <text x="237" y="128" font-family="ui-monospace,monospace" font-size="13" fill="#5d6e85" letter-spacing="2.2">ENGINEERING · BUBBLE WORKSHOP</text>
</svg>
