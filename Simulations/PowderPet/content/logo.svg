    <circle cx="182" cy="34" r="2.5"/>
    <circle cx="164" cy="158" r="4"/>
    <circle cx="32" cy="156" r="3"/>
    <circle cx="60" cy="176" r="3.5"/>
  </g>

  <g transform="translate(10 0)" filter="url(#softGlow)">
    <path d="M113 49 L142 22 L155 58 L127 80 Z" fill="url(#petEar)" opacity="0.9"/>
    <path d="M99 49 L70 22 L58 58 L87 80 Z" fill="url(#petEar)" opacity="0.9"/>
    <path d="M62 102 C62 62, 84 40, 111 41 C146 42, 166 70, 167 106 C168 147, 145 170, 111 170 C79 170, 62 144, 62 102 Z" fill="url(#petBody)"/>
    <path d="M79 92 C90 84, 100 82, 111 83 C122 84, 132 88, 140 96 C134 88, 125 82, 111 80 C98 78, 86 82, 79 92 Z" fill="#ddefff" opacity="0.75"/>

    <ellipse cx="91" cy="106" rx="10" ry="12" fill="#12314a"/>
    <ellipse cx="131" cy="106" rx="10" ry="12" fill="#12314a"/>
    <circle cx="95" cy="102" r="3.3" fill="#f4fbff"/>
    <circle cx="127" cy="102" r="3.3" fill="#f4fbff"/>
    <circle cx="90" cy="102" r="1.2" fill="#0f1727"/>
    <circle cx="122" cy="102" r="1.2" fill="#0f1727"/>

    <path d="M111 117 Q118 123 111 129 Q104 123 111 117 Z" fill="#ffbca8"/>
    <path d="M103 132 Q111 138 119 132" fill="none" stroke="#4c6ba8" stroke-width="2.2" stroke-linecap="round"/>

    <path d="M74 130 C82 151, 95 160, 111 160 C127 160, 141 151, 149 130" fill="none" stroke="#d9fdff" stroke-width="4" stroke-linecap="round" opacity="0.75"/>
    <path d="M88 150 L81 166" stroke="#7cdaf7" stroke-width="5" stroke-linecap="round"/>
    <path d="M134 150 L141 166" stroke="#7cdaf7" stroke-width="5" stroke-linecap="round"/>
    <path d="M100 145 L95 164" stroke="#7cdaf7" stroke-width="4" stroke-linecap="round"/>
    <path d="M122 145 L127 164" stroke="#7cdaf7" stroke-width="4" stroke-linecap="round"/>
