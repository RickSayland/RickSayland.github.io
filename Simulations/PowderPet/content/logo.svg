  <g fill="#dbe9ff" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="200" y="98" font-size="44" font-weight="700" letter-spacing="0.5">Powder Pet</text>
    <text x="203" y="130" font-size="12" font-weight="600" letter-spacing="3.6" fill="#8eaecd">DUST-BORN COMPANION</text>
