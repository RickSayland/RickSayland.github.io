<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 570 214" role="img" aria-labelledby="title desc">
  <title id="title">Powder Pet</title>
  <desc id="desc">A cute powder creature with dust motes and the Powder Pet wordmark.</desc>
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="48%" r="60%">
      <stop offset="0%" stop-color="#9de7ff" stop-opacity="0.32"/>
      <stop offset="48%" stop-color="#6ee7c2" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0a1620" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="petBody" cx="38%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#f9f8ff"/>
      <stop offset="26%" stop-color="#dff1ff"/>
      <stop offset="60%" stop-color="#7dc7ff"/>
      <stop offset="100%" stop-color="#4164bf"/>
    </radialGradient>
    <radialGradient id="petEar" cx="35%" cy="25%" r="75%">
      <stop offset="0%" stop-color="#f9f8ff"/>
      <stop offset="100%" stop-color="#b2d6ff"/>
    </radialGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="570" height="214" fill="#091720"/>
  <circle cx="106" cy="107" r="104" fill="url(#bgGlow)"/>

  <g opacity="0.8" fill="#bfe6ff" filter="url(#softGlow)">
