<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rick's Code Playground</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="container">
        <header class="site-header">
            <h1>Rick's Code Playground</h1>
        </header>

        <section class="section">
            <h2 class="section-title">Game Library</h2>
            <div class="grid">
                <a href="/Games/SLFTheGame/" class="card">
                    <img alt="Silly Little Friends" src="/Games/SLFTheGame/content/logo.png" class="card-img">
                </a>
                <div class="card placeholder"><span>In Progress</span></div>
                <div class="card placeholder"><span>In Progress</span></div>
            </div>
        </section>

        <section class="section">
            <h2 class="section-title">Simulations</h2>
            <div class="grid">
                <a href="/Games/ControlPanel/" class="card">
                    <img alt="Reactor Control Panel" src="/Games/ControlPanel/content/logo.png" class="card-img">
                </a>
                <a href="/Games/GeoSim/" class="card">
                    <img alt="GeoSim" src="/Games/GeoSim/content/logo.svg" class="card-img">
                </a>
                <div class="card placeholder"><span>In Progress</span></div>
            </div>
        </section>

        <section class="section">
            <h2 class="section-title">Tools</h2>
            <div class="grid">
                <a href="/Games/QuantTools/" class="card">
                    <img alt="Quant Tools" src="/Games/QuantTools/content/logo.png" class="card-img">
                </a>
                <div class="card placeholder"><span>In Progress</span></div>
                <div class="card placeholder"><span>In Progress</span></div>
            </div>
        </section>
    </div>
</body>
</html>
