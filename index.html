<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rick's Code Playground</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="container">
        <header class="site-header">
            <h1>Rick's Code Playground</h1>
        </header>

        <section class="section">
            <h2 class="section-title">Game Library</h2>
            <div class="grid">
                <a href="/Games/SLFTheGame/" class="card">
                    <img alt="Silly Little Friends" src="/Games/SLFTheGame/content/logo.png" class="card-img">
                    <span class="card-badge">In dev</span>
                </a>
                <a href="/Games/JellyDrift/" class="card">
                    <img alt="JellyDrift" src="/Games/JellyDrift/content/logo.svg" class="card-img">
                    <span class="card-badge">In dev</span>
                </a>
                <a href="/Games/IntergalacticTraffic/dist/" class="card">
                    <img alt="Intergalactic Traffic Simulator" src="/Games/IntergalacticTraffic/content/logo.svg" class="card-img">
                    <span class="card-badge">In dev</span>
                </a>
                <a href="/Games/SillyLittleWrestlers/" class="card">
                    <img alt="Silly Little Wrestlers" src="/Games/SillyLittleWrestlers/content/logo.svg" class="card-img">
                    <span class="card-badge">In dev</span>
                </a>
            </div>
        </section>

        <section class="section">
            <h2 class="section-title">Simulations</h2>
            <div class="grid">
                <a href="/Simulations/ControlPanel/" class="card">
                    <img alt="Reactor Control Panel" src="/Simulations/ControlPanel/content/logo.png" class="card-img">
                    <span class="card-badge">In dev</span>
                </a>
                <a href="/Simulations/GeoSim/" class="card">
                    <img alt="GeoSim" src="/Simulations/GeoSim/content/logo.svg" class="card-img">
                    <span class="card-badge">In dev</span>
                </a>
                <a href="/Simulations/BonkSimulator/" class="card">
                    <img alt="Bonk Simulator" src="/Simulations/BonkSimulator/content/logo.svg" class="card-img">
                    <span class="card-badge">In dev</span>
                </a>
                <a href="/Simulations/GutSim/" class="card">
                    <img alt="GutSim" src="/Simulations/GutSim/content/logo.svg" class="card-img">
                    <span class="card-badge">In dev</span>
                </a>
                <a href="/Simulations/Geodynamo/" class="card">
                    <img alt="Geodynamo" src="/Simulations/Geodynamo/content/logo.svg" class="card-img">
                    <span class="card-badge">In dev</span>
                </a>
                <a href="/Simulations/SocietySim/" class="card">
                    <img alt="SocietySim" src="/Simulations/SocietySim/content/logo.svg" class="card-img">
                    <span class="card-badge">In dev</span>
                </a>
                <a href="/Simulations/Criticality/" class="card">
                    <img alt="Criticality" src="/Simulations/Criticality/content/logo.svg" class="card-img">
                    <span class="card-badge">In dev</span>
                </a>
                <a href="/Simulations/WarpField/" class="card">
                    <img alt="Warp Field Engineering" src="/Simulations/WarpField/content/logo.svg" class="card-img">
                    <span class="card-badge">In dev</span>
                </a>
                <a href="/Simulations/AtomViewer/" class="card">
                    <img alt="Atom Viewer" src="/Simulations/AtomViewer/content/logo.svg" class="card-img">
                    <span class="card-badge">In dev</span>
                </a>
            </div>
        </section>

        <section class="section">
            <h2 class="section-title">Japanese Learning</h2>
            <div class="grid">
                <a href="/Japanese/ProgressTracker/" class="card">
                    <img alt="Japanese Progress Tracker" src="/Japanese/ProgressTracker/content/logo.svg" class="card-img">
                    <span class="card-badge">In dev</span>
                </a>
            </div>
        </section>

        <section class="section">
            <h2 class="section-title">Tools</h2>
            <div class="grid">
                <a href="/Tools/QuantTools/" class="card">
                    <img alt="Quant Tools" src="/Tools/QuantTools/content/logo.png" class="card-img">
                    <span class="card-badge">In dev</span>
                </a>
                <a href="/Tools/RunTrack/" class="card">
                    <img alt="RunTrack" src="/Tools/RunTrack/content/logo.png" class="card-img">
                    <span class="card-badge">In dev</span>
                </a>
                <div class="card placeholder"><span>In Progress</span></div>
            </div>
        </section>
    </div>
</body>
</html>
