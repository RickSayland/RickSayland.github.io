<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 285 107" width="285" height="107" role="img" aria-label="JellyDrift">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a3a5c"/>
      <stop offset="1" stop-color="#04121f"/>
    </linearGradient>
    <radialGradient id="bell" cx="0.5" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#d7f6ff"/>
      <stop offset="0.55" stop-color="#5fd0ff"/>
      <stop offset="1" stop-color="#2a86c8" stop-opacity="0.35"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="285" height="107" fill="url(#bg)"/>

  <!-- light motes -->
  <g fill="#8cd2ff" opacity="0.14">
    <circle cx="40" cy="24" r="1.5"/>
    <circle cx="230" cy="18" r="1.5"/>
    <circle cx="255" cy="60" r="1.5"/>
    <circle cx="205" cy="88" r="1.5"/>
    <circle cx="30" cy="80" r="1.5"/>
  </g>

  <!-- jellyfish -->
  <g transform="translate(60 54)" filter="url(#glow)">
    <g stroke="#7fd8f2" stroke-width="1.6" stroke-linecap="round" opacity="0.6" fill="none">
      <path d="M-14 8 Q-16 26 -12 40"/>
      <path d="M-7 10 Q-10 30 -6 44"/>
      <path d="M0 11 Q-1 30 1 46"/>
      <path d="M7 10 Q10 30 6 44"/>
      <path d="M14 8 Q16 26 12 40"/>
    </g>
    <path d="M-22 2 A22 20 0 0 1 22 2 Q11 12 0 6 Q-11 12 -22 2 Z" fill="url(#bell)"/>
  </g>

  <!-- wordmark -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-weight="700">
    <text x="112" y="58" font-size="30" fill="#eafaff" letter-spacing="0.5">Jelly</text>
    <text x="186" y="58" font-size="30" fill="#5fd0ff" letter-spacing="0.5">Drift</text>
  </g>
  <text x="113" y="76" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#6f93a8" letter-spacing="2">DRIFT THE DEEP</text>
</svg>
