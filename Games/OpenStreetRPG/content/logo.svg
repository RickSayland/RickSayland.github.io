<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 285 107" width="285" height="107" role="img" aria-label="OpenStreetRPG">
  <!-- land, park, water: the OSM standard palette -->
  <rect width="285" height="107" fill="#efe9dd"/>
  <path d="M206 -2 L287 -2 L287 34 L238 40 Q214 36 206 22 Z" fill="#cdebb0"/>
  <path d="M-10 99 C 40 88, 80 112, 140 101 S 232 90, 296 103" fill="none" stroke="#aad3df" stroke-width="11"/>

  <!-- buildings -->
  <g fill="#d9d0c9" stroke="#c6bab0" stroke-width="1">
    <rect x="4" y="6" width="22" height="16"/>
    <rect x="32" y="4" width="16" height="22"/>
    <rect x="4" y="44" width="18" height="20"/>
    <rect x="148" y="2" width="26" height="18"/>
    <rect x="252" y="48" width="26" height="18"/>
    <rect x="198" y="80" width="22" height="9"/>
  </g>

  <!-- streets: casing, then fill -->
  <g fill="none" stroke-linecap="round">
    <g stroke="#cfc4b4" stroke-width="9">
      <path d="M58 -10 L70 120"/>
      <path d="M196 -10 L184 120"/>
      <path d="M-10 33 L300 27"/>
      <path d="M-10 84 L300 74"/>
    </g>
    <g stroke="#ffffff" stroke-width="6.5">
      <path d="M58 -10 L70 120"/>
      <path d="M196 -10 L184 120"/>
      <path d="M-10 84 L300 74"/>
    </g>
    <path d="M-10 33 L300 27" stroke="#fcd6a4" stroke-width="6.5"/>
  </g>

  <!-- the quest trail -->
  <path d="M-4 60 C 10 60, 18 70, 32 74" fill="none" stroke="#d9473a" stroke-width="2.2" stroke-dasharray="0.1 5" stroke-linecap="round"/>

  <!-- the hero, front view (the same shapes player.js draws) -->
  <g transform="translate(42 80) scale(1.45)">
    <ellipse cx="0" cy="0" rx="10" ry="3.6" fill="rgba(25,18,40,0.3)"/>
    <g fill="#241b30" stroke="#241b30" stroke-width="3" stroke-linejoin="round">
      <rect x="-6" y="-11" width="5" height="11" rx="2"/>
      <rect x="1" y="-11" width="5" height="11" rx="2"/>
      <rect x="-11.5" y="-21" width="4.5" height="10" rx="2.2"/>
      <rect x="7" y="-21" width="4.5" height="10" rx="2.2"/>
      <rect x="-8" y="-22" width="16" height="13.5" rx="4"/>
      <circle cx="0" cy="-30" r="10.3"/>
    </g>
    <rect x="-6" y="-11" width="5" height="11" rx="2" fill="#3f3a58"/>
    <rect x="1" y="-11" width="5" height="11" rx="2" fill="#3f3a58"/>
    <rect x="-6.5" y="-4.5" width="6" height="4.5" rx="2" fill="#57381f"/>
    <rect x="0.5" y="-4.5" width="6" height="4.5" rx="2" fill="#57381f"/>
    <rect x="-11.5" y="-21" width="4.5" height="10" rx="2.2" fill="#2f6c46"/>
    <rect x="7" y="-21" width="4.5" height="10" rx="2.2" fill="#2f6c46"/>
    <circle cx="-9.25" cy="-11" r="2.3" fill="#f5c9a3"/>
    <circle cx="9.25" cy="-11" r="2.3" fill="#f5c9a3"/>
    <rect x="-8" y="-22" width="16" height="13.5" rx="4" fill="#3f8f5c"/>
    <rect x="-6" y="-20.5" width="2.2" height="7" rx="1" fill="#8a552a"/>
    <rect x="3.8" y="-20.5" width="2.2" height="7" rx="1" fill="#8a552a"/>
    <rect x="-7.6" y="-14" width="15.2" height="2.6" fill="#6e4524"/>
    <rect x="-1.6" y="-14.3" width="3.2" height="3.2" rx="0.6" fill="#f0c94a"/>
    <circle cx="0" cy="-30" r="10" fill="#f5c9a3"/>
    <path d="M-9.98 -27.43 A 10.3 10.3 0 1 1 9.98 -27.43 L7.5 -31 L5 -35 L2 -32.5 L-1 -35.5 L-3.5 -32.5 L-6.5 -35 L-7.5 -31 Z" fill="#5b3520"/>
    <rect x="-5" y="-29.5" width="2.4" height="3.4" rx="1.2" fill="#241b30"/>
    <rect x="2.6" y="-29.5" width="2.4" height="3.4" rx="1.2" fill="#241b30"/>
    <rect x="-4.6" y="-29.1" width="1" height="1" fill="#fff"/>
    <rect x="3" y="-29.1" width="1" height="1" fill="#fff"/>
    <ellipse cx="-6.3" cy="-24.8" rx="1.9" ry="1.1" fill="rgba(236,112,104,0.45)"/>
    <ellipse cx="6.3" cy="-24.8" rx="1.9" ry="1.1" fill="rgba(236,112,104,0.45)"/>
  </g>

  <!-- the wordmark, on the same panel the in-game HUD uses -->
  <rect x="78" y="34" width="196" height="42" rx="10" fill="rgba(28,21,40,0.9)" stroke="#f0c94a" stroke-opacity="0.55"/>
  <text x="176" y="62.5" text-anchor="middle" textLength="176" lengthAdjust="spacingAndGlyphs"
        font-family="'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="23" font-weight="800">
    <tspan fill="#f4ecd8">OpenStreet</tspan><tspan fill="#f0c94a">RPG</tspan>
  </text>
</svg>
